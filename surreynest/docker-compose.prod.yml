# ─── SurreyNest Production Compose ────────────────────────────────────────────
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Requires: POSTGRES_PASSWORD, REDIS_PASSWORD, SECRET_KEY, FRONTEND_URL,
#           and INTERNAL_ADMIN_KEY set in environment or .env
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL with PostGIS ─────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: surreynest-db
    restart: always
    environment:
      POSTGRES_DB: surreynest
      POSTGRES_USER: surreynest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U surreynest -d surreynest" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed — only accessible from internal Docker network

    # ─── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: surreynest-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed — only accessible from internal Docker network

    # ─── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: surreynest-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://surreynest:${POSTGRES_PASSWORD}@postgres:5432/surreynest
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_ADMIN_KEY: "${INTERNAL_ADMIN_KEY:?INTERNAL_ADMIN_KEY must be set}"
      ENVIRONMENT: production
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://surreynest.com}"
      FRONTEND_URL: "${FRONTEND_URL:?FRONTEND_URL must be set}"
      ML_MODEL_VERSION: ${ML_MODEL_VERSION:-v8.0.0}
      ML_MODEL_PATH: app/ml/models
      EPC_API_USERNAME: ${EPC_API_USERNAME}
      EPC_API_KEY: ${EPC_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-SurreyNest <noreply@surreynest.com>}"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    # No volume mounts — code is baked into the Docker image

    # ─── Nginx Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${VITE_CLOUDFLARE_ANALYTICS_TOKEN:-}
    container_name: surreynest-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: surreynest_prod_postgres
  redis_data:
    name: surreynest_prod_redis
